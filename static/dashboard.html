<!DOCTYPE html>
<html>
<head>
    <title>Task Queue Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #0a0e27; color: white; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #00ff9d; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-card { background: #1a1f3a; padding: 20px; border-radius: 10px; flex: 1; text-align: center; }
        .stat-number { font-size: 36px; font-weight: bold; color: #00ff9d; }
        button { background: #00ff9d; color: #0a0e27; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; background: #1a1f3a; border: 1px solid #00ff9d; color: white; }
        .task-item { background: #1a1f3a; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 Task Queue System on Render</h1>
    <div class="stats">
        <div class="stat-card"><div class="stat-number" id="queueSize">-</div><div>Queue Size</div></div>
        <div class="stat-card"><div class="stat-number" id="deadLetterSize">-</div><div>Dead Letter Queue</div></div>
    </div>
    <div style="background: #1a1f3a; padding: 20px; border-radius: 10px;">
        <h2>Submit Task</h2>
        <select id="taskType">
            <option value="email">Email</option>
            <option value="fail_me">Test Failure</option>
        </select>
        <input type="text" id="emailTo" placeholder="To email">
        <input type="text" id="emailSubject" placeholder="Subject">
        <button onclick="submitTask()">Submit Task</button>
        <div id="result"></div>
    </div>
    <div style="background: #1a1f3a; padding: 20px; border-radius: 10px; margin-top: 20px;">
        <h2>Dead Letter Queue</h2>
        <div id="deadLetters"></div>
    </div>
</div>
<script>
    function loadStats() {
        fetch('/stats').then(r=>r.json()).then(d=>{
            document.getElementById('queueSize').innerText = d.queue_size;
            document.getElementById('deadLetterSize').innerText = d.dead_letter_size;
        });
    }
    function submitTask() {
        let type = document.getElementById('taskType').value;
        let payload = {};
        if(type === 'email') {
            payload = {to: document.getElementById('emailTo').value, subject: document.getElementById('emailSubject').value};
        }
        fetch('/tasks', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({type,payload,max_retries:2})})
        .then(r=>r.json()).then(d=>{
            document.getElementById('result').innerHTML = `<p>✅ Task submitted: ${d.task_id}</p>`;
            loadStats();
        });
    }
    loadStats();
    setInterval(loadStats, 3000);
</script>
</body>
</html>
