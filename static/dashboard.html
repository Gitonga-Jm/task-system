<!DOCTYPE html>
<html>
<head>
    <title>Task Queue Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #0a0e27;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #00ff9d;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            background: #1a1f3a;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #00ff9d;
        }
        .card {
            background: #1a1f3a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #0a0e27;
            border: 1px solid #00ff9d;
            color: white;
            border-radius: 5px;
        }
        button {
            background: #00ff9d;
            color: #0a0e27;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .task-item {
            background: #0a0e27;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 3px solid #00ff9d;
        }
        .badge {
            background: #dc3545;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Task Queue Dashboard</h1>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="queueSize">-</div>
            <div>Queue Size</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="deadLetterSize">-</div>
            <div>Dead Letter Queue</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="tasksCreated">-</div>
            <div>Tasks Created</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="tasksFailed">-</div>
            <div>Tasks Failed</div>
        </div>
    </div>

    <div class="card">
        <h2>Submit Task</h2>
        <select id="taskType">
            <option value="email">Email</option>
            <option value="fail_me">Test Failure</option>
        </select>

        <div id="emailFields">
            <input type="email" id="emailTo" placeholder="To: email@example.com">
            <input type="text" id="emailSubject" placeholder="Subject">
            <textarea id="emailBody" rows="3" placeholder="Message"></textarea>
        </div>

        <div id="failFields" style="display:none;">
            <p>This task will fail 3 times then go to Dead Letter Queue</p>
        </div>

        <button onclick="submitTask()">Submit Task</button>
        <div id="submitResult"></div>
    </div>

    <div class="card">
        <h2>Dead Letter Queue</h2>
        <button onclick="loadDeadLetters()">Refresh</button>
        <button onclick="clearDeadLetters()">Clear All</button>
        <div id="deadLetters"></div>
    </div>
</div>

<script>
    async function loadStats() {
        const response = await fetch('/stats');
        const data = await response.json();
        document.getElementById('queueSize').innerText = data.queue_size || 0;
        document.getElementById('deadLetterSize').innerText = data.dead_letter_size || 0;
        document.getElementById('tasksCreated').innerText = data.total_tasks_created || 0;
        document.getElementById('tasksFailed').innerText = data.total_tasks_failed || 0;
    }

    async function loadDeadLetters() {
        const response = await fetch('/dead-letter');
        const data = await response.json();
        const container = document.getElementById('deadLetters');
        
        if (!data.tasks || data.tasks.length === 0) {
            container.innerHTML = '<p>No failed tasks</p>';
            return;
        }
        
        container.innerHTML = '';
        for (const task of data.tasks) {
            container.innerHTML += `
                <div class="task-item">
                    <strong>${task.type}</strong>
                    <span class="badge">FAILED</span>
                    <div>ID: ${task.task_id}</div>
                    <div>Error: ${task.last_error}</div>
                    <button onclick="retryTask('${task.task_id}')">Retry</button>
                    <button onclick="deleteTask('${task.task_id}')">Delete</button>
                </div>
            `;
        }
    }

    async function submitTask() {
        const type = document.getElementById('taskType').value;
        let payload = {};
        
        if (type === 'email') {
            payload = {
                to: document.getElementById('emailTo').value,
                subject: document.getElementById('emailSubject').value,
                body: document.getElementById('emailBody').value
            };
        }
        
        const response = await fetch('/tasks', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer demo_key_123456789'
            },
            body: JSON.stringify({ type, payload, max_retries: 3 })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            document.getElementById('submitResult').innerHTML = `<p style="color: #00ff9d;">Task submitted: ${data.task_id}</p>`;
            if (type === 'email') {
                document.getElementById('emailTo').value = '';
                document.getElementById('emailSubject').value = '';
                document.getElementById('emailBody').value = '';
            }
            loadStats();
            setTimeout(() => {
                document.getElementById('submitResult').innerHTML = '';
            }, 3000);
        } else {
            document.getElementById('submitResult').innerHTML = `<p style="color: #ff4444;">Error: ${data.detail}</p>`;
        }
    }

    async function retryTask(taskId) {
        await fetch(`/dead-letter/retry/${taskId}`, { method: 'POST' });
        loadDeadLetters();
        loadStats();
    }

    async function deleteTask(taskId) {
        if (confirm('Delete this failed task?')) {
            await fetch(`/dead-letter/${taskId}`, { method: 'DELETE' });
            loadDeadLetters();
            loadStats();
        }
    }

    async function clearDeadLetters() {
        if (confirm('Delete ALL failed tasks?')) {
            await fetch('/dead-letter/clear', { method: 'DELETE' });
            loadDeadLetters();
            loadStats();
        }
    }

    document.getElementById('taskType').addEventListener('change', function() {
        const isEmail = this.value === 'email';
        document.getElementById('emailFields').style.display = isEmail ? 'block' : 'none';
        document.getElementById('failFields').style.display = isEmail ? 'none' : 'block';
    });

    loadStats();
    loadDeadLetters();
    setInterval(loadStats, 5000);
</script>
</body>
</html>
