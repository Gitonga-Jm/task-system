services:
  # Redis Database (Free)
  - type: redis
    name: task-system-redis
    plan: free
    maxmemoryPolicy: noeviction

  # API Web Service
  - type: web
    name: task-system-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_HOST
        fromService:
          type: redis
          name: task-system-redis
          property: hostname
      - key: REDIS_PORT
        value: 6379
      - key: PYTHON_VERSION
        value: 3.11.15

  # Worker 1
  - type: worker
    name: task-system-worker1
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: REDIS_HOST
        fromService:
          type: redis
          name: task-system-redis
          property: hostname
      - key: REDIS_PORT
        value: 6379

  # Worker 2
  - type: worker
    name: task-system-worker2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: REDIS_HOST
        fromService:
          type: redis
          name: task-system-redis
          property: hostname
      - key: REDIS_PORT
        value: 6379

  # Worker 3
  - type: worker
    name: task-system-worker3
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: REDIS_HOST
        fromService:
          type: redis
          name: task-system-redis
          property: hostname
      - key: REDIS_PORT
        value: 6379
